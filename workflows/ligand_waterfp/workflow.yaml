# Machine-readable manifest for the ligand_waterfp workflow.
# Describes stage order, modules, and their inputs/outputs. Parameter
# defaults live in configs/ligand_waterfp.yaml, not here. `module` paths
# are importable ligand_waterfp submodules (pip install -e . first);
# `console_script` names are the entry points pyproject.toml registers
# for the same module's main().

name: ligand_waterfp
description: >
  Ligand-only hydration analysis: unbiased MD -> WaterFP calculation ->
  block-wise convergence -> official WaterFP atom selection -> G1/G2
  ligand atom selection -> ligand-side CV construction.
package: ligand_waterfp
upstream_method:
  waterfp_repo: https://github.com/valeriorizzi/WaterFP
  vendored_commit: 6a5aef725a66b28e86d3582aee3e9e8bbbe4bc54

stages:
  - id: system_setup
    module: ligand_waterfp.system_setup.prepare_ligand_system
    console_script: ligand-waterfp-prepare-system
    inputs: [ligand_gro, ligand_top]
    outputs: [npt_gro, npt_cpt, system_top]

  - id: convergence
    module: ligand_waterfp.convergence.monitor_convergence
    console_script: ligand-waterfp-monitor
    depends_on: [system_setup]
    inputs: [tpr, xtc]
    outputs: [convergence_summary_json, convergence_metrics_csv, fp_values_by_block_wide_csv]

  - id: waterfp
    module: ligand_waterfp.waterfp.run_waterfp
    console_script: ligand-waterfp-run-waterfp
    depends_on: [convergence]
    inputs: [tpr, xtc]
    outputs: [rdf_csv, fingerprints_csv]

  - id: official_selection
    modules:
      - module: ligand_waterfp.official_selection.prepare_ranking_csv    # new glue: fingerprints.csv -> ranking_csv
        console_script: ligand-waterfp-prepare-ranking-csv
      - module: ligand_waterfp.official_selection.run_official_selection  # vendored algorithm, verbatim
        console_script: ligand-waterfp-select
    depends_on: [waterfp]
    inputs: [fingerprints_csv, tpr]
    outputs: [ranking_csv, g1_g2_yaml]
    note: >
      Selection logic in run_official_selection.py is vendored verbatim
      from upstream_method.waterfp_repo - never reimplemented.
      prepare_ranking_csv.py is new glue code (the upstream repo does not
      publish how its own ranking.csv was built). run_official_selection's
      main() now also parses the two result sentences and writes the
      structured G1/G2 YAML directly (via
      ligand_waterfp.g1_g2_selection.select_g1_g2 - a helper module with
      no CLI of its own, not a separate pipeline stage) - no intermediate
      text file, no separate parsing stage. See
      src/ligand_waterfp/official_selection/README.md.

  - id: ligand_cv
    module: ligand_waterfp.ligand_cv.build_ligand_cv
    console_script: ligand-waterfp-build-cv
    depends_on: [official_selection]
    inputs: [g1_g2_yaml]
    outputs: [plumed_fragment_dat]

  - id: visualization
    optional: true
    modules:
      - module: ligand_waterfp.visualization.render_selected_atoms       # invoked via `pymol -cq <path> -- ...`, not a console script
      - module: ligand_waterfp.visualization.render_selected_atoms_chimera  # invoked via `chimera --script <path> ...`, not a console script
      - module: ligand_waterfp.visualization.add_legend
        console_script: ligand-waterfp-add-legend
    depends_on: [official_selection]
    inputs: [complex_pdb, g1_g2_yaml]
    outputs: [selected_atoms_png]

outputs_root: outputs/   # git-ignored; see .gitignore
