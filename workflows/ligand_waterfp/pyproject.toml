[project]
name = "ligand-waterfp"
version = "0.1.0"
description = "Ligand-only WaterFP hydration-CV workflow: unbiased MD -> WaterFP -> convergence -> official atom selection -> G1/G2 -> ligand-side CV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "MDAnalysis>=2.0",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "networkx",
    "PyYAML",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# stage 7 rendering needs a PyMOL or Chimera install, invoked by path
# (pymol -cq .../render_selected_atoms.py -- ...), not via console_scripts -
# see visualization/README.md. Nothing extra to pip-install here.

[project.scripts]
ligand-waterfp-prepare-system = "ligand_waterfp.system_setup.prepare_ligand_system:main"
ligand-waterfp-monitor = "ligand_waterfp.convergence.monitor_convergence:main"
ligand-waterfp-rdf = "ligand_waterfp.waterfp.calculate_rdf:main"
ligand-waterfp-fingerprint = "ligand_waterfp.waterfp.calculate_fingerprint:main"
ligand-waterfp-run-waterfp = "ligand_waterfp.waterfp.run_waterfp:main"
ligand-waterfp-prepare-ranking-csv = "ligand_waterfp.official_selection.prepare_ranking_csv:main"
ligand-waterfp-select = "ligand_waterfp.official_selection.run_official_selection:main"
ligand-waterfp-build-cv = "ligand_waterfp.ligand_cv.build_ligand_cv:main"
ligand-waterfp-add-legend = "ligand_waterfp.visualization.add_legend:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
