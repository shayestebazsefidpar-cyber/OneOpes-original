[project]
name = "oneopes"
version = "0.1.0"
description = "Hydration (WaterFP) and funnel collective variables for OneOPES, from unbiased MD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "MDAnalysis>=2.0",
    "numpy>=2",
    "pandas",
    "scipy",
    "matplotlib",
    "freesasa",
    "PyYAML",
    "Pillow",
    "cyclopts>=5.3.2",
    "pydantic>=2.14.1",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "networkx>=3.6.1",
    "pytest>=7",
]
# stage 5 rendering needs a PyMOL or Chimera install, invoked by path
# (pymol -cq .../render_selected_atoms.py -- ...), not via console_scripts -
# see docs/render.md. Nothing extra to pip-install here. The funnel
# (oneopes.funnel) needs BioSimSpace, which is conda-only.

[project.scripts]
oneopes = "oneopes.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
