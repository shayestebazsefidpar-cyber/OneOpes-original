[project]
name = "oneopes"
version = "0.1.0"
description = "Hydration (WaterFP) and funnel collective variables for OneOPES, from unbiased MD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "MDAnalysis>=2.8",
    "numpy>=2",
    "pandas",
    "scipy>=1.11",
    "matplotlib",
    "freesasa",
    "PyYAML",
    "Pillow",
    "cyclopts>=5.3.2",
    "pydantic>=2.14.1",
    "tabulate>=0.10.0",
    "xarray>=2026.9.0",
    "h5netcdf[h5py]>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "networkx>=3.6.1",
    "pandas-stubs>=3.0.5.260914",
    "pyright[nodejs]>=1.1.414",
    "pytest>=7",
    "ruff>=0.17.3",
    "scipy-stubs>=1.17.1.5",
]
notebooks = [
    "marimo>=0.25.2",
]
# stage 5 rendering needs a PyMOL or Chimera install, invoked by path
# (pymol -cq .../render_selected_atoms.py -- ...), not via console_scripts -
# see docs/render.md. Nothing extra to pip-install here. The funnel
# (oneopes.funnel) needs BioSimSpace, which is conda-only.

[project.scripts]
oneopes = "oneopes.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

# Code checks: `uv run ruff check` and `uv run pyright`.
[tool.ruff]
line-length = 120
# The vendored upstream code is kept verbatim; the render scripts run inside PyMOL / Chimera.
extend-exclude = ["tests/reference", "src/oneopes/render/render_selected_atoms*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "SIM", "C4", "PIE", "RET", "PTH", "N", "RUF"]
ignore = [
    "B008",  # frozen dataclasses (RadialGrid(), AnalysisOptions()) are safe argument defaults
    "N802", "N803", "N806", "N815",  # unit suffixes such as cutoff_A, and the published names G1 / G2
    "N813",  # import MDAnalysis as mda, MDAnalysis' own convention
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["B018"]  # a marimo cell displays its last expression

[tool.ruff.lint.flake8-bugbear]
# Frozen option dataclasses: safe defaults of other option dataclasses.
extend-immutable-calls = [
    "oneopes.system.SystemOptions", "oneopes.trajectory_blocks.FrameWindow",
    "oneopes.waterfp.HydrationOptions", "oneopes.block_run.BlockOptions",
]

[tool.pyright]
include = ["src"]
exclude = ["src/oneopes/render/render_selected_atoms.py", "src/oneopes/render/render_selected_atoms_chimera.py"]
venvPath = "."
venv = ".venv"
# Trust only libraries that publish types (numpy, pandas-stubs, scipy-stubs, pydantic, cyclopts):
# MDAnalysis has no type information, and guessing it from its source gives false errors.
useLibraryCodeForTypes = false
